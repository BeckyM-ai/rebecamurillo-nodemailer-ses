name: Deploy to AWS Lambda

on: 
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_NAME: nodemailer-ses-serverless

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Remove and Deploy Lambda function
      run: |
        npx serverless remove --function ${{ env.FUNCTION_NAME }} --region ${{ secrets.AWS_REGION }} --role ${{ secrets.AWS_ROLE_ARN }}
        npx serverless deploy --function ${{ env.FUNCTION_NAME }} --region ${{ secrets.AWS_REGION }} --role ${{ secrets.AWS_ROLE_ARN }}
