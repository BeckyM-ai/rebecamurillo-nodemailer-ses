# serverless.yml
service: aws-nodejs

provider:
  name: aws
  runtime: nodejs20.x
  custom:
    region: eu-west-3
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "ses:SendEmail"
            - "ses:SendRawEmail"
          Resource: "*"
  environment:
    AWS_REGION_SES: eu-west-3
    DEFAULT_TO_EMAIL: rebeca.murillo.pro@gmail.com
    DEFAULT_FROM_EMAIL: rebeca.murillo.pro@gmail.com

functions:
  sendEmail:
    handler: index.handler
    name: nodemailer-ses-serverless
    description: Send email using nodemailer and AWS SES   
    events:
      - http:
          path: message
          method: post
