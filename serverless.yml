# serverless.yml
service: aws-nodejs

provider:
  name: aws
  runtime: nodejs20.x
  region: ${param:AWS_REGION}
  stage: production
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "ses:SendEmail"
            - "ses:SendRawEmail"
          Resource: "*"
  environment:
    AWS_REGION_SES: ${param:AWS_REGION}
    DEFAULT_TO_EMAIL: ${param:DEFAULT_TO_EMAIL}
    DEFAULT_FROM_EMAIL: ${param:DEFAULT_FROM_EMAIL}

resources:
  Resources:
    RateLimiter:
      Type: AWS::ApiGateway::UsagePlan
      Properties:
        ApiStages:
          - ApiId: !Ref ApiGatewayRestApi
            Stage: !Ref ApiGatewayStage
        Quota:
          Limit: 5
          Period: DAY
        Throttle:
          BurstLimit: 5
          RateLimit: 0.2

functions:
  sendEmail:
    handler: index.handler
    name: nodemailer-ses-serverless
    description: Send email using nodemailer and AWS SES   
    events:
      - http:
          path: message
          method: post
          cors: true