# serverless.yml
service: aws-nodejs

provider:
  name: aws
  runtime: nodejs20.x
  region: {$opt:AWS_REGION_SES}
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "ses:SendEmail"
            - "ses:SendRawEmail"
          Resource: "*"
  environment:
    AWS_REGION_SES: {$opt:AWS_REGION_SES}
    DEFAULT_TO_EMAIL: {$opt:DEFAULT_TO_EMAIL}
    DEFAULT_FROM_EMAIL: {$opt:DEFAULT_FROM_EMAIL}

functions:
  sendEmail:
    handler: index.handler
    name: nodemailer-ses-serverless
    description: Send email using nodemailer and AWS SES   
    events:
      - http:
          path: message
          method: post
