# serverless.yml
service: aws-nodejs

provider:
  name: aws
  runtime: nodejs20.x
  region: ${param:AWS_REGION}
  stage: production
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "ses:SendEmail"
            - "ses:SendRawEmail"
          Resource: "*"
  environment:
    AWS_REGION_SES: ${param:AWS_REGION}
    DEFAULT_TO_EMAIL: ${param:DEFAULT_TO_EMAIL}
    DEFAULT_FROM_EMAIL: ${param:DEFAULT_FROM_EMAIL}
    CAPTCHA_SECRET_KEY: ${param:CAPTCHA_SECRET_KEY}

functions:
  sendEmail:
    handler: index.handler
    name: nodemailer-ses-serverless
    description: Send email using nodemailer and AWS SES   
    events:
      - http:
          path: message
          method: post
          cors:
            origin: ${param:ALLOWED_ORIGIN}